name: Update market data
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p "tests.py" -v
      - run: python collector.py
      - name: Commit data
        run: |
          git config user.name 'market-data-bot'
          git config user.email 'market-data-bot@users.noreply.github.com'
          git add docs/data.json
          git diff --cached --quiet || (git commit -m 'Update market data' && git push)
